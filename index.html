<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>每日英文精读 · Daily English Reading</title>
<meta name="description" content="每日英文精读：经典演讲、小说、散文 + 关键词积累 + 全文翻译。">
<meta property="og:title" content="每日英文精读 · Daily English Reading">
<meta property="og:description" content="经典演讲、小说、散文 + 关键词积累 + 全文翻译。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kinghihido.github.io/english-daily/">
<style>
  :root{
    --bg:#f7f8fa; --panel:#ffffff; --ink:#1f2733; --muted:#6b7686;
    --line:#e6e9ef; --accent:#2f6df0; --accent-soft:#eaf1ff;
    --chip:#eef2f7; --radius:14px;
    --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Songti SC","Noto Serif SC",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  header.top{position:sticky;top:0;z-index:10;background:rgba(247,248,250,.9);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header.top .logo{font-size:22px}
  header.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
  header.top .sub{color:var(--muted);font-size:12.5px;margin-top:1px}
  nav.mode{display:flex;gap:6px;margin-left:6px}
  .navbtn{padding:6px 13px;border:1px solid var(--line);background:var(--panel);border-radius:10px;cursor:pointer;
    font-size:13px;color:var(--muted);font-weight:600;font-family:var(--sans)}
  .navbtn:hover{color:var(--ink)}
  .navbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  header.top .repo{margin-left:auto;font-size:12.5px;color:var(--muted)}
  .menu-btn{display:none}
  .layout{display:grid;grid-template-columns:300px 1fr;gap:0;align-items:start}
  aside{position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto;border-right:1px solid var(--line);
    background:var(--panel);padding:16px 12px}
  aside .sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 10px;margin-top:6px}
  .article-item{padding:11px 12px;border-radius:10px;cursor:pointer;margin:2px 0;border:1px solid transparent;transition:.15s}
  .article-item:hover{background:var(--accent-soft)}
  .article-item.active{background:var(--accent-soft);border-color:#cfe0ff}
  .article-item .t{font-weight:600;font-size:14px;line-height:1.35}
  .article-item .m{font-size:11.5px;color:var(--muted);margin-top:3px}
  main{padding:26px 30px 80px;max-width:900px}
  .empty{color:var(--muted);margin-top:40px;text-align:center}
  .meta-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 14px}
  .chip{background:var(--chip);color:var(--muted);font-size:12px;padding:3px 10px;border-radius:999px}
  .article-title{font-family:var(--serif);font-size:30px;line-height:1.2;margin:4px 0 6px;font-weight:700}
  .article-sub{color:var(--muted);font-size:15px;margin-bottom:14px;font-style:italic}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:18px 0 22px}
  .tab{padding:8px 16px;border:none;background:none;font-family:var(--sans);font-size:14px;color:var(--muted);
    cursor:pointer;border-bottom:2px solid transparent;font-weight:600}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .content{font-family:var(--serif);font-size:18px;line-height:1.85;color:#23303f}
  .content h1{font-size:26px;margin:28px 0 12px}
  .content h2{font-size:21px;margin:26px 0 10px;padding-left:10px;border-left:4px solid var(--accent)}
  .content h3{font-size:18px;margin:20px 0 8px}
  .content p{margin:0 0 16px}
  .content hr{border:none;border-top:1px dashed var(--line);margin:22px 0}
  .content table{border-collapse:collapse;width:100%;font-size:14.5px;font-family:var(--sans);margin:10px 0 18px}
  .content th,.content td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  .content th{background:var(--accent-soft);font-weight:600}
  .content code{background:var(--chip);padding:1px 6px;border-radius:6px;font-size:.9em}
  .content blockquote{margin:14px 0;padding:8px 16px;border-left:3px solid var(--line);color:var(--muted)}
  .foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;text-align:center}
  @media (max-width:820px){
    .layout{grid-template-columns:1fr}
    aside{position:fixed;left:0;top:57px;width:78%;max-width:320px;transform:translateX(-100%);transition:.2s;z-index:20;box-shadow:var(--radius)}
    aside.open{transform:translateX(0)}
    .menu-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--line);
      background:var(--panel);border-radius:10px;cursor:pointer;font-size:18px}
    main{padding:20px 18px 70px}
    .article-title{font-size:24px}
    .content{font-size:17px}
  }
</style>
</head>
<body>
<header class="top">
  <button class="menu-btn" id="menuBtn" aria-label="目录">☰</button>
  <span class="logo">📖</span>
  <div>
    <h1>每日英文精读</h1>
    <div class="sub">Daily English Reading · 经典演讲 / 小说 / 散文 + 关键词积累 + 全文翻译</div>
  </div>
  <nav class="mode">
    <button class="navbtn active" data-m="articles">📖 文章</button>
    <button class="navbtn" data-m="vocab">📒 单词本</button>
  </nav>
  <a class="repo" href="https://github.com/kinghihido/english-daily" target="_blank" rel="noopener">GitHub 仓库 ↗</a>
</header>

<div class="layout">
  <aside id="sidebar"></aside>
  <main>
    <div id="reader"><div class="empty">正在加载…</div></div></main>
  </div>
</div>

<script src="assets/lib/marked.min.js"></script>
<script src="assets/lib/purify.min.js"></script>
<script>
marked.setOptions({ gfm:true, breaks:false });
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const state = { articles:[], current:null, tab:'all', mode:'articles', vocab:{}, vocabSel:'ALL' };

function render(md){ return DOMPurify.sanitize(marked.parse(md||'')); }
function stripFrontMatter(md){
  if(md.startsWith('---')){ const i=md.indexOf('\n---',3); if(i!==-1) return md.slice(i+4).replace(/^\n+/,''); }
  return md;
}
function splitSections(body){
  const v=body.indexOf('\n# 📚'), t=body.indexOf('\n# 🌏');
  let e='',vocab='',trans='';
  if(v===-1) e=body;
  else { e=body.slice(0,v); if(t===-1) vocab=body.slice(v); else { vocab=body.slice(v,t); trans=body.slice(t);} }
  return {e,vocab,trans};
}

/* ---------- 文章模式 ---------- */
async function loadManifest(){
  const res = await fetch('manifest.json',{cache:'no-cache'});
  state.articles = (await res.json()).sort((a,b)=>b.date.localeCompare(a.date));
}
function buildList(){
  const el=document.getElementById('list'); el.innerHTML='';
  state.articles.forEach(a=>{
    const d=document.createElement('div');
    d.className='article-item'+(state.current===a.file?' active':'');
    d.innerHTML=`<div class="t">${a.title}</div><div class="m">${a.date} · ${a.category} · ${a.word_count||''} 词</div>`;
    d.onclick=()=>{ selectArticle(a.file); document.getElementById('sidebar').classList.remove('open'); };
    el.appendChild(d);
  });
}
async function selectArticle(file){
  state.current=file; state.tab='all'; buildList();
  const art=state.articles.find(a=>a.file===file);
  const body=stripFrontMatter(await (await fetch(file,{cache:'no-cache'})).text());
  const sec=splitSections(body); state.sec=sec; state.art=art;
  const tabs=[['all','全部'],['english','原文'],['vocab','词汇'],['trans','翻译']];
  document.getElementById('reader').innerHTML=`
    <div class="meta-bar"><span class="chip">${art.date}</span><span class="chip">${art.category}</span><span class="chip">${art.word_count||''} 词</span></div>
    <div class="article-title">${art.title}</div>
    <div class="article-sub">${art.subtitle||''}</div>
    <div class="tabs" id="tabs">${tabs.map(t=>`<button class="tab" data-k="${t[0]}">${t[1]}</button>`).join('')}</div>
    <div class="content" id="content"></div>
    <div class="foot">文章来自 GitHub 仓库 <a href="https://github.com/kinghihido/english-daily" target="_blank" rel="noopener">kinghihido/english-daily</a>，每日自动更新。</div>`;
  document.querySelectorAll('#tabs .tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.k;paint();});
  paint();
}
function paint(){
  const s=state.sec; let md='';
  if(state.tab==='all') md=s.e+(s.vocab?'\n'+s.vocab:'')+(s.trans?'\n'+s.trans:'');
  else if(state.tab==='english') md=s.e;
  else if(state.tab==='vocab') md=s.vocab||'_（本文无词汇表）_';
  else if(state.tab==='trans') md=s.trans||'_（本文无译文）_';
  document.getElementById('content').innerHTML=render(md);
  document.querySelectorAll('#tabs .tab').forEach(b=>b.classList.toggle('active',b.dataset.k===state.tab));
  window.scrollTo({top:0});
}

/* ---------- 单词本模式 ---------- */
async function loadVocab(){
  await Promise.all(LETTERS.map(async L=>{
    try{ const r=await fetch(`vocab/${L}.md`,{cache:'no-cache'}); if(r.ok) state.vocab[L]=await r.text(); }catch(e){}
  }));
}
function vocabCount(){
  let n=0; LETTERS.forEach(L=>{ if(!state.vocab[L])return;
    state.vocab[L].split('\n').forEach(l=>{ if(l.startsWith('| ')&&!l.includes('单词')&&!/^\|[\s\-|]+\|$/.test(l)) n++; }); });
  return n;
}
function renderVocabSidebar(){
  const exist=LETTERS.filter(L=>state.vocab[L]);
  const sb=document.getElementById('sidebar');
  sb.innerHTML='<div class="sec">单词本 · 按字母</div>'+
    `<div class="article-item ${state.vocabSel==='ALL'?'active':''}" data-l="ALL">全部字母</div>`+
    exist.map(L=>`<div class="article-item ${state.vocabSel===L?'active':''}" data-l="${L}">${L}</div>`).join('');
  sb.querySelectorAll('.article-item').forEach(d=>d.onclick=()=>{ state.vocabSel=d.dataset.l; renderVocabSidebar(); renderVocab(state.vocabSel); document.getElementById('sidebar').classList.remove('open'); });
}
function renderVocab(letter){
  const order=letter==='ALL'?LETTERS.filter(L=>state.vocab[L]):[letter];
  let md=''; order.forEach(L=>md+=(state.vocab[L]||'')+'\n\n');
  document.getElementById('reader').innerHTML=`
    <div class="meta-bar"><span class="chip">单词本</span><span class="chip">已收录 ${vocabCount()} 个</span><span class="chip">按字母 A–Z 归档</span></div>
    <div class="article-title">📒 单词积累</div>
    <div class="article-sub">每日新增文章会自动把生词归入对应字母；重复词不重复收录。</div>
    <div class="content">${render(md)}</div>
    <div class="foot">单词由每日英文精读自动归档自各篇文章。</div>`;
  window.scrollTo({top:0});
}

/* ---------- 模式切换 ---------- */
function setMode(m){
  state.mode=m;
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.m===m));
  if(m==='articles'){ document.getElementById('sidebar').innerHTML='<div class="sec">文章列表</div><div id="list"></div>'; buildList();
    if(state.current) selectArticle(state.current); else if(state.articles.length) selectArticle(state.articles[0].file); }
  else { if(!Object.keys(state.vocab).length) loadVocab().then(()=>{ renderVocabSidebar(); renderVocab(state.vocabSel); });
         else { renderVocabSidebar(); renderVocab(state.vocabSel); } }
}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');

setMode('articles');
loadManifest().then(()=>{ if(state.mode==='articles'){ buildList(); if(state.articles.length) selectArticle(state.articles[0].file); } })
  .catch(e=>{ document.getElementById('reader').innerHTML=`<div class="empty">加载失败：${e.message}<br>请通过 GitHub Pages 地址打开本页面。</div>`; });
</script>
</body>
</html>
